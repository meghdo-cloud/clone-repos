{{- range .Values.jobs }}
apiVersion: batch/v1
kind: Job
metadata:
  name: clone-repo-{{ .jobName }}
  namespace: clone-repos
  annotations:
    sidecar.istio.io/inject: "false"
spec:
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: {{ $.Values.serviceaccount.name }}
      containers:
        - name: clone-repos
          image: {{ $.Values.image }}
          args:
          {{- range $key, $value := .arguments }}
          - "--{{ $key }}"
          - "{{ $value }}"
          {{- end }}
          volumeMounts:
            - mountPath: "/root/token"
              subPath: "token"
              name: github-token
      restartPolicy: Never
      volumes:
        - name: github-token
          csi:
            driver: {{ $.Values.driver }}
            readOnly: true
            volumeAttributes:
              secretProviderClass: github-token
---
{{- end }}